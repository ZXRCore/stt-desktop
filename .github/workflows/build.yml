name: Build desktop installer

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout stt-desktop
        uses: actions/checkout@v4

      - name: Checkout stt-backend
        uses: actions/checkout@v4
        with:
          repository: ZXRCore/stt-backend
          path: backend
          token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Checkout stt-frontend
        uses: actions/checkout@v4
        with:
          repository: ZXRCore/stt-frontend
          path: frontend
          token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/Scripts/pip install --no-cache-dir -r requirements.txt
          .venv/Scripts/pip install --no-cache-dir pyinstaller

      - name: Build sidecar (PyInstaller)
        working-directory: backend
        run: ./build_sidecar.ps1

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm install -g npm@11
          npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build desktop installer
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0xstt-desktop-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
