name: Build desktop installer

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout stt-desktop
        uses: actions/checkout@v4

      - name: Checkout stt-backend
        uses: actions/checkout@v4
        with:
          repository: ZXRCore/stt-backend
          path: backend
          token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Checkout stt-frontend
        uses: actions/checkout@v4
        with:
          repository: ZXRCore/stt-frontend
          path: frontend
          token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/Scripts/pip install --no-cache-dir -r requirements.txt
          .venv/Scripts/pip install --no-cache-dir pyinstaller

      - name: Build sidecar (PyInstaller)
        working-directory: backend
        run: ./build_sidecar.ps1

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm install -g npm@11
          npm ci

      - name: Generate desktop static frontend
        working-directory: frontend
        run: npm run generate:desktop

      # Самоподписанный Authenticode-сертификат (издатель "ZXR Core", один
      # стабильный между версиями — важно для накопления SmartScreen-репутации
      # и для Tauri Updater, у которого должен быть тот же издатель между
      # версиями) — импортируем PFX-secret в CurrentUser store перед сборкой,
      # certificateThumbprint в tauri.conf.json ссылается именно на него.
      - name: Import code signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $bytes)
          $securePassword = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -Force -AsPlainText
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item $certPath

      - name: Build & release desktop installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: v__VERSION__
          args: --target ${{ matrix.target }}
          includeUpdaterJson: true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0xstt-desktop-installer-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
